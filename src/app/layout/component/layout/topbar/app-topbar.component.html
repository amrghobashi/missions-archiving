<div class="layout-topbar">
    <div class="layout-topbar-logo-container">
        <button class="layout-menu-button layout-topbar-action" (click)="layoutService.onMenuToggle()">
            <i class="pi pi-bars"></i>
        </button>
        <a class="layout-topbar-logo" routerLink="/">
            <span style="display: flex;"> 
                <span style="color: #10b981; padding-left: 4px; font-size: x-large;"> </span>
                MISSIONS ARCHIVING SYSTEM 
            </span>
            <img src="assets/atsc.png" alt="Logo" style="height: 2.5rem;" />
        </a>
    </div>

    <div class="layout-topbar-actions">
        <div class="layout-config-menu">
            <button type="button" class="layout-topbar-action" (click)="toggleDarkMode()">
                <i [ngClass]="{ 'pi ': true, 'pi-moon': layoutService.isDarkTheme(), 'pi-sun': !layoutService.isDarkTheme() }"></i>
            </button>
        </div>

        <!-- User menu trigger (mobile) -->
        <button class="layout-topbar-menu-button layout-topbar-action" pStyleClass="@next" enterFromClass="hidden" enterActiveClass="animate-scalein" leaveToClass="hidden" leaveActiveClass="animate-fadeout" [hideOnOutsideClick]="true">
            <i class="pi pi-ellipsis-v"></i>
        </button>

        <!-- Desktop user area -->
        <div class="layout-topbar-menu hidden lg:block">
            <div class="layout-topbar-menu-content">
                <!-- Current user info + logout -->
                <div class="flex items-center gap-3">
                    <div class="flex flex-col items-end leading-tight">
                        <span class="text-sm font-semibold">{{ authService.currentUser()?.name }}</span>
                        <span class="text-xs text-muted-color">{{ authService.currentUser()?.email }}</span>
                    </div>
                    <p-menu #userMenu [model]="userMenuItems" [popup]="true" appendTo="body" />
                    <button
                        type="button"
                        class="layout-topbar-action"
                        (click)="userMenu.toggle($event)"
                        pTooltip="Account"
                        tooltipPosition="bottom"
                    >
                        <p-avatar
                            [label]="userInitials"
                            shape="circle"
                            [style]="{'background-color': '#10b981', 'color': 'white', 'font-size': '0.75rem', 'width': '2rem', 'height': '2rem'}"
                        />
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
